    lifecycle: HISTORICAL
    agent_usage: VISION_ONLY_NEVER_SCOPE_OR_BACKLOG
    source_audit_manifest: ../phase-scope/source-audit/SOURCE-AUDIT-MANIFEST.yaml

  - path_prefix: ../phase-scope/archive/
    authority: NON_AUTHORIZING
    lifecycle: HISTORICAL
    agent_usage: NEVER_IMPLEMENT

  - path: ../phase-scope/00_README.md
