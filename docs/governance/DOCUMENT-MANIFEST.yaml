schema_version: 1
default_policy:
  matching_precedence: EXACT_PATH_BEFORE_LONGEST_PATH_PREFIX
  unlisted_document:
    authority: NON_AUTHORIZING
    lifecycle: UNCLASSIFIED
    agent_usage: DO_NOT_USE_AS_BUSINESS_SOURCE
  search_result_rule: CHECK_THIS_MANIFEST_BEFORE_USE

documents:
  - path: ../00-IMPLEMENTATION-GATE.md
    authority: READINESS_AND_AMBIGUITY_GUIDANCE
    lifecycle: ACTIVE
    agent_usage: USE_TO_IDENTIFY_SLICE_SPECIFIC_DEPENDENCIES

  - path: README.md
    authority: GOVERNANCE_GUIDANCE
    lifecycle: ACTIVE
    agent_usage: MANDATORY_AUTHORITY_RULES
  - path: DOCUMENT-MANIFEST.yaml
    authority: AUTHORITY_INDEX
    lifecycle: ACTIVE
    agent_usage: MANDATORY_AUTHORITY_LOOKUP
  - path: TASK-GO-TEMPLATE.md
    authority: GOVERNANCE_TEMPLATE
    lifecycle: TEMPLATE
    agent_usage: OPTIONAL_INDEPENDENT_TASK_REVIEW
  - path: AGENT-ORCHESTRATION.md
    authority: ORCHESTRATION_PROCESS
    lifecycle: ACTIVE
    agent_usage: MANDATORY_FOR_MULTI_AGENT_COORDINATION
  - path: ORCHESTRATION-RUN-TEMPLATE.md
    authority: ORCHESTRATION_TEMPLATE
    lifecycle: TEMPLATE
    agent_usage: USE_FOR_LONG_MULTI_AGENT_OR_HIGH_RISK_TASKS
  - path: PHASED-IMPLEMENTATION-PLAN.md
    authority: DELIVERY_SEQUENCE
    lifecycle: ACTIVE
    agent_usage: MANDATORY_PHASE_ORDER_AND_EXIT_CRITERIA
  - path: PHASE-STATUS.yaml
    authority: DELIVERY_PROCESS_STATE
    lifecycle: ACTIVE
    agent_usage: ORCHESTRATOR_UPDATES_FROM_ACCEPTED_EVIDENCE_ONLY
  - path: validate-docs.ps1
    authority: VALIDATION_TOOL
    lifecycle: ACTIVE
    agent_usage: SAFE_READ_ONLY_VALIDATION

  - path: ../README.md
    authority: DOCUMENTATION_ENTRY_POINT
    lifecycle: ACTIVE
    agent_usage: NAVIGATION_AND_PRECEDENCE
  - path: ../BRIEF.md
    authority: NON_AUTHORIZING
    lifecycle: SUMMARY
    agent_usage: CONTEXT_ONLY
  - path: ../DECISIONS.md
    authority: DECISION_INDEX_NOT_EVIDENCE
    lifecycle: ACTIVE_INDEX
    agent_usage: NAVIGATION_ONLY_FOLLOW_REFERENCED_RECORD

  - path: ../techHistory/phase-1/Phase_1_Technical_Specification_HY.md
    authority: OWNER_AUTHORIZED_BUSINESS_BASELINE
    lifecycle: ACTIVE_DEVELOPMENT_BASELINE
    agent_usage: BUSINESS_SOURCE_FOR_PHASE_I_DEVELOPMENT
    signed_artifact_manifest: ../techHistory/phase-1/SIGNATURE-STATUS.yaml

  - path: ../techHistory/phase-1/Phase_1_Technical_Specification_HY.docx
    authority: CLIENT_RENDERING
    lifecycle: RETAINED_STALE_RENDERING
    agent_usage: RETAINED_STALE_RENDERING_DO_NOT_INFER_PARITY_OR_DELETE

  - path: ../techHistory/phase-1/Phase_1_Technical_Specification_HY.pdf
    authority: CLIENT_RENDERING
    lifecycle: RETAINED_STALE_RENDERING
    agent_usage: RETAINED_STALE_RENDERING_DO_NOT_INFER_PARITY_OR_DELETE

  - path: ../techHistory/phase-1/SIGNATURE-STATUS.yaml
    authority: SIGNATURE_AND_ARTIFACT_STATUS
    lifecycle: ACTIVE_LEGAL_AND_REPOSITORY_STATUS_REGISTER
    agent_usage: LEGAL_STATUS_INFORMATION_AND_OWNER_AUTHORIZATION

  - path: ../techHistory/phase-1/Phase_1_Technical_Specification_HY_signed.jpg
    authority: SIGNATURE_EVIDENCE
    lifecycle: SUBMITTED_SIGNATURE_PAGE
