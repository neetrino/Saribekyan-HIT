schema_version: 1
default_policy:
  matching_precedence: EXACT_PATH_BEFORE_LONGEST_PATH_PREFIX
  unlisted_document:
    authority: NON_AUTHORIZING
    lifecycle: UNCLASSIFIED
    agent_usage: STOP_BEFORE_IMPLEMENTATION
  search_result_rule: CHECK_THIS_MANIFEST_BEFORE_USE

documents:
  - path: ../00-IMPLEMENTATION-GATE.md
    authority: EXECUTION_CONTROL
    lifecycle: ACTIVE
    agent_usage: MANDATORY_PRE_CODE

  - path: README.md
    authority: GOVERNANCE_GUIDANCE
    lifecycle: ACTIVE
    agent_usage: MANDATORY_AUTHORITY_RULES
  - path: DOCUMENT-MANIFEST.yaml
    authority: AUTHORITY_INDEX
    lifecycle: ACTIVE
    agent_usage: MANDATORY_AUTHORITY_LOOKUP
  - path: TASK-GO-TEMPLATE.md
    authority: GOVERNANCE_TEMPLATE
    lifecycle: TEMPLATE
    agent_usage: REQUIRED_FOR_BUSINESS_TASK_GO_RECORD
  - path: validate-docs.ps1
    authority: VALIDATION_TOOL
    lifecycle: ACTIVE
    agent_usage: SAFE_READ_ONLY_VALIDATION

  - path: ../README.md
    authority: DOCUMENTATION_ENTRY_POINT
    lifecycle: ACTIVE
    agent_usage: NAVIGATION_AND_PRECEDENCE
  - path: ../BRIEF.md
    authority: NON_AUTHORIZING
    lifecycle: SUMMARY
    agent_usage: CONTEXT_ONLY
  - path: ../DECISIONS.md
    authority: DECISION_INDEX_NOT_EVIDENCE
    lifecycle: ACTIVE_INDEX
    agent_usage: NAVIGATION_ONLY_FOLLOW_REFERENCED_RECORD

  - path: ../contract/phase-1/Phase_1_Technical_Specification_HY.md
    authority: CONTRACT_CONTENT_BASELINE
    lifecycle: DRAFT_CONTRACT
    agent_usage: DESIGN_AND_TRACEABILITY_ONLY_UNTIL_SIGNATURE_MANIFEST_IS_SIGNED
    signed_artifact_manifest: ../contract/phase-1/SIGNATURE-STATUS.yaml

  - path: ../contract/phase-1/Phase_1_Technical_Specification_HY.docx
    authority: CLIENT_RENDERING
    lifecycle: RETAINED_STALE_RENDERING
    agent_usage: RETAINED_STALE_RENDERING_DO_NOT_INFER_PARITY_OR_DELETE

  - path: ../contract/phase-1/Phase_1_Technical_Specification_HY.pdf
    authority: CLIENT_RENDERING
    lifecycle: RETAINED_STALE_RENDERING
    agent_usage: RETAINED_STALE_RENDERING_DO_NOT_INFER_PARITY_OR_DELETE

  - path: ../contract/phase-1/SIGNATURE-STATUS.yaml
    authority: SIGNATURE_AND_ARTIFACT_STATUS
    lifecycle: ACTIVE_UNSIGNED_REGISTER
    agent_usage: MANDATORY_SIGNATURE_CHECK

  - path: ../contract/phase-1/Phase_1_Technical_Specification_Legal_Review_Recommendations_RU.md
    authority: NON_AUTHORIZING
    lifecycle: LEGAL_REVIEW_GUIDANCE
    agent_usage: LEGAL_REVIEW_ONLY_NEVER_SCOPE_OR_IMPLEMENTATION

  - path: ../../ՍԱՐԻԲԵԿՅԱՆ_ՀԱՄԱԼՍԱՐԱՆԱԿԱՆ_ԲԺՇԿԱԿԱՆ_ՀԱՄԱԼԻՐԻ_ՄԻԱՍՆԱԿԱՆ_ՏԵՂԵԿԱՏՎԱԿԱՆ.docx.md
    authority: NON_AUTHORIZING
    lifecycle: HISTORICAL
    agent_usage: VISION_ONLY_NEVER_SCOPE_OR_BACKLOG
    source_audit_manifest: ../phase-scope/source-audit/SOURCE-AUDIT-MANIFEST.yaml

  - path_prefix: ../phase-scope/archive/
    authority: NON_AUTHORIZING
    lifecycle: HISTORICAL
    agent_usage: NEVER_IMPLEMENT

  - path: ../phase-scope/00_README.md
    authority: NON_AUTHORIZING
    lifecycle: HISTORICAL_INDEX
    agent_usage: NAVIGATION_ONLY_NOT_NEXT_STEP_AUTHORIZATION

  - path_prefix: ../phase-scope/phases/phase-1/
    authority: NON_AUTHORIZING
    lifecycle: HISTORICAL
    agent_usage: SOURCE_ANALYSIS_ONLY_NEVER_SPEC_OR_ACCEPTANCE

  - path_prefix: ../phase-scope/cross-cutting/
    authority: NON_AUTHORIZING
    lifecycle: HISTORICAL
    agent_usage: SOURCE_ANALYSIS_ONLY

  - path: ../phase-scope/decisions/09_Decision_Log.md
    authority: NON_AUTHORIZING
    lifecycle: HISTORICAL
    agent_usage: DECISION_HISTORY_ONLY

  - path: ../phase-scope/decisions/17_Questions_Only_After_Source_Audit.md
    authority: NON_AUTHORIZING
    lifecycle: HISTORICAL
    agent_usage: QUESTION_HISTORY_ONLY

  - path_prefix: ../phase-scope/source-audit/
    authority: NON_AUTHORIZING
    lifecycle: HISTORICAL
    agent_usage: PROVENANCE_ONLY

  - path_prefix: ../phase-scope/phases/phase-2/
    authority: NON_AUTHORIZING
    lifecycle: HISTORICAL
    agent_usage: FUTURE_INVENTORY_ONLY

  - path_prefix: ../phase-scope/phases/phase-3/
    authority: NON_AUTHORIZING
    lifecycle: HISTORICAL
    agent_usage: FUTURE_INVENTORY_ONLY

  - path_prefix: ../phase-scope/decisions/client/21_
    authority: NON_AUTHORIZING
    lifecycle: HISTORICAL
    agent_usage: SUPERSEDED_QUESTION_SET

  - path_prefix: ../phase-scope/decisions/client/31_
    authority: NON_AUTHORIZING
    lifecycle: HISTORICAL
    agent_usage: SUPERSEDED_APPROVAL_PACKAGE

  - path: ../phase-scope/decisions/client/32_Client_Clarifications_Resolution_Phase_1_HY.md
    authority: NON_AUTHORIZING_UNTIL_CLIENT_EVIDENCE
    lifecycle: RETAINED_DRAFT_TEXT
    agent_usage: RETAINED_DRAFT_NOT_DECISION_OR_SCOPE

  - path: ../phase-scope/decisions/client/23_Template_Content_Commercial_Boundary.md
    authority: NON_AUTHORIZING
    lifecycle: HISTORICAL
    agent_usage: COMMERCIAL_HISTORY_ONLY_USE_TA_SECTION_7

  - path: ../phase-scope/decisions/client/33_Client_Post_Signing_Inputs_Phase_1_HY.md
    authority: NON_AUTHORIZING
    lifecycle: HISTORICAL
    agent_usage: CLIENT_INPUT_CHECKLIST_NOT_SCHEMA

  - path: ../phase-scope/decisions/client/README.md
    authority: NON_AUTHORIZING_INDEX
    lifecycle: ACTIVE_INDEX
    agent_usage: CLIENT_ARTIFACT_NAVIGATION_ONLY

  - path: ../requirements/README.md
    authority: NON_AUTHORIZING
    lifecycle: ASSESSMENT
    agent_usage: GOVERNANCE_GUIDANCE_NOT_IMPLEMENTATION

  - path: ../requirements/GLOSSARY.md
    authority: NON_AUTHORIZING
    lifecycle: REFERENCE
    agent_usage: DEFINITIONS_ONLY_NO_PACKAGE_OR_SCOPE_INFERENCE

  - path: ../requirements/MODULE-SOURCE-MATRIX.md
    authority: NON_AUTHORIZING
    lifecycle: ASSESSMENT
    agent_usage: CANDIDATE_MAPPING_ONLY

  - path: ../requirements/OPENMRS-FIT-GAP.md
    authority: NON_AUTHORIZING
    lifecycle: ASSESSMENT
    agent_usage: FIT_GAP_ONLY_NEVER_INSTALL_OR_IMPLEMENT

  - path: ../requirements/PHASE-1-TRACEABILITY.md
    authority: EXECUTION_GATE_REGISTER
    lifecycle: ACTIVE_NO_GO_REGISTER
    agent_usage: MANDATORY_REQUIREMENT_LEVEL_CHECK
  - path: ../requirements/WORKFLOW-TRANSITIONS.md
    authority: BLOCKER_REGISTER
    lifecycle: ACTIVE
    agent_usage: NO_GO_UNTIL_APPROVED_ROW
  - path: ../requirements/PERMISSION-MATRIX.md
    authority: BLOCKER_REGISTER
    lifecycle: ACTIVE
    agent_usage: NO_GO_UNTIL_APPROVED_ROW
  - path: ../requirements/REPORT-DEFINITIONS.md
    authority: BLOCKER_REGISTER
    lifecycle: ACTIVE
    agent_usage: NO_GO_UNTIL_APPROVED_ROW

  - path_prefix: ../modules/
    authority: NON_AUTHORIZING_TEMPLATE_OR_RECORD
    lifecycle: TEMPLATE_OR_DESIGN_RECORD
    agent_usage: REQUIRES_TASK_GO_EVIDENCE

  - path_prefix: ../technology-options/
    authority: NON_AUTHORIZING
    lifecycle: ASSESSMENT
    agent_usage: NEVER_INSTALL_FROM_CANDIDATE_LIST

  - path: ../TECH_CARD.md
    authority: TECHNICAL_DECISION_INDEX
    lifecycle: MIXED_PER_ROW
    agent_usage: USE_ONLY_ROWS_WITH_CANONICAL_STATUS_AND_DECISION_EVIDENCE

  - path_prefix: ../architecture/
    authority: TECHNICAL_DECISION_RECORD
    lifecycle: MIXED_PER_DOCUMENT
    agent_usage: NEVER_CREATES_BUSINESS_SCOPE

  - path: ../01-ARCHITECTURE.md
    authority: NON_AUTHORIZING
    lifecycle: PROPOSED_DESIGN
    agent_usage: TARGET_DESIGN_ONLY
  - path: ../03-STRUCTURE.md
    authority: NON_AUTHORIZING
    lifecycle: PROPOSED_DESIGN
    agent_usage: TARGET_DESIGN_ONLY
  - path: ../04-API.md
    authority: NON_AUTHORIZING
    lifecycle: PROPOSED_DESIGN
    agent_usage: APPLY_ONLY_AFTER_ENDPOINT_GO
  - path: ../05-DATABASE.md
    authority: NON_AUTHORIZING
    lifecycle: PROPOSED_DESIGN
    agent_usage: APPLY_ONLY_AFTER_SCHEMA_GO
  - path: ../06-SECURITY-AND-PRIVACY.md
    authority: NON_AUTHORIZING
    lifecycle: PROPOSED_DESIGN
    agent_usage: REVIEW_CHECKLIST_ONLY_UNLESS_REQUIREMENT_APPROVED
  - path: ../07-INTEGRATIONS.md
    authority: NON_AUTHORIZING
    lifecycle: PROPOSED_DESIGN
    agent_usage: APPLY_ONLY_AFTER_CONNECTOR_GO

  - path: ../pilot/COMPATIBILITY-POC.md
    authority: D008_EXCEPTION_SPEC
    lifecycle: ACTIVE_LIMITED_AUTHORIZATION
    agent_usage: ONLY_D008_COMPATIBILITY_POC
