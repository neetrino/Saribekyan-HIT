  - path: ../requirements/PERMISSION-MATRIX.md
    authority: BLOCKER_REGISTER
    lifecycle: ACTIVE
    agent_usage: BLOCKS_ONLY_TASKS_THAT_IMPLEMENT_THIS_ROW
  - path: ../requirements/REPORT-DEFINITIONS.md
    authority: BLOCKER_REGISTER
    lifecycle: ACTIVE
    agent_usage: BLOCKS_ONLY_TASKS_THAT_IMPLEMENT_THIS_ROW

  - path_prefix: ../modules/
    authority: NON_AUTHORIZING_TEMPLATE_OR_RECORD
    lifecycle: TEMPLATE_OR_DESIGN_RECORD
    agent_usage: USE_FOR_MODULE_DESIGN_OR_AS_BUILT_RECORD_WITH_REQUIREMENT_EVIDENCE

  - path: ../modules/SARIBEKYAN-OMOD.md
